<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotik — Музыкальный Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 100px; }
        header { padding: 16px; background: #181818; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #282828; }
        h1 { font-size: 22px; margin-bottom: 12px; color: #1db954; }
        .search-box { width: 100%; padding: 12px 16px; border-radius: 24px; border: none; background: #242424; color: #ffffff; font-size: 15px; outline: none; }
        .playlist { padding: 12px; }
        .track-item { display: flex; align-items: center; padding: 10px; border-radius: 8px; margin-bottom: 8px; background: #181818; cursor: pointer; }
        .track-item.active { border-left: 4px solid #1db954; background: #222222; }
        .track-cover { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; margin-right: 12px; background: #333; }
        .track-info { flex-grow: 1; overflow: hidden; }
        .track-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .track-artist { font-size: 13px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #282828; border-top: 1px solid #3e3e3e; padding: 12px 16px; display: flex; align-items: center; }
        .player-cover { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; margin-right: 12px; }
        .player-info { flex-grow: 1; overflow: hidden; margin-right: 12px; }
        .player-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play-btn { background: #1db954; border: none; width: 42px; height: 42px; border-radius: 50%; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .empty-message { text-align: center; color: #b3b3b3; margin-top: 40px; font-size: 15px; padding: 20px; }
        .load-more-btn { display: block; width: 100%; padding: 12px; background: #242424; color: #1db954; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>Spotik</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск треков или исполнителей...">
    </header>

    <div class="playlist" id="playlist">
        <div class="empty-message">⏳ Загрузка музыки...</div>
    </div>

    <div class="player-bar" id="playerBar" style="display: none;">
        <img id="playerCover" class="player-cover" src="" alt="">
        <div class="player-info">
            <div id="playerTitle" class="player-title"></div>
            <div id="playerArtist" class="player-artist"></div>
        </div>
        <button id="playPauseBtn" class="play-btn">⏸</button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        let allSongs = [];
        let displayedCount = 50;
        let currentFilteredSongs = [];
        let currentPlayingSongId = null;
        let isPlaying = false;

        const playlistContainer = document.getElementById('playlist');
        const searchInput = document.getElementById('searchInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const playerBar = document.getElementById('playerBar');
        const playerCover = document.getElementById('playerCover');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playPauseBtn = document.getElementById('playPauseBtn');

        fetch('songs.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                allSongs = data;
                currentFilteredSongs = allSongs;
                renderSongs();
            })
            .catch(err => {
                console.error(err);
                playlistContainer.innerHTML = '<div class="empty-message" style="color: #ff5555;">❌ Ошибка загрузки базы треков</div>';
            });

        function renderSongs(isAppend = false) {
            if (!isAppend) {
                playlistContainer.innerHTML = '';
            }

            if (currentFilteredSongs.length === 0) {
                playlistContainer.innerHTML = '<div class="empty-message">Ничего не найдено 😢</div>';
                return;
            }

            const chunk = currentFilteredSongs.slice(0, displayedCount);
            
            const oldBtn = document.getElementById('loadMoreBtn');
            if (oldBtn) oldBtn.remove();

            chunk.forEach(song => {
                const item = document.createElement('div');
                item.className = 'track-item';
                if (currentPlayingSongId === song.id) {
                    item.classList.add('active');
                }
                
                item.innerHTML = `
                    <img class="track-cover" src="${song.cover || ''}" alt="" loading="lazy">
                    <div class="track-info">
                        <div class="track-title">${song.title}</div>
                        <div class="track-artist">${song.artist}</div>
                    </div>
                `;
                item.onclick = () => playTrack(song);
                playlistContainer.appendChild(item);
            });

            if (displayedCount < currentFilteredSongs.length) {
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.id = 'loadMoreBtn';
                loadMoreBtn.className = 'load-more-btn';
                loadMoreBtn.innerText = `Загрузить еще (${currentFilteredSongs.length - displayedCount} доступно)`;
                loadMoreBtn.onclick = () => {
                    displayedCount += 50;
                    renderSongs(false);
                };
                playlistContainer.appendChild(loadMoreBtn);
            }
        }

        searchInput.oninput = (e) => {
            const query = e.target.value.toLowerCase().trim();
            displayedCount = 50;
            if (!query) {
                currentFilteredSongs = allSongs;
            } else {
                currentFilteredSongs = allSongs.filter(song => 
                    song.title.toLowerCase().includes(query) || 
                    song.artist.toLowerCase().includes(query)
                );
            }
            renderSongs();
        };

        function playTrack(song) {
            currentPlayingSongId = song.id;
            audioPlayer.src = song.url;
            audioPlayer.play().then(() => {
                isPlaying = true;
                playPauseBtn.innerText = '⏸';
            }).catch(e => console.error(e));

            playerCover.src = song.cover || '';
            playerTitle.innerText = song.title;
            playerArtist.innerText = song.artist;
            playerBar.style.display = 'flex';
            
            renderSongs();
        }

        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playPauseBtn.innerText = '▶';
            } else {
                audioPlayer.play();
                isPlaying = true;
                playPauseBtn.innerText = '⏸';
            }
        };

        audioPlayer.onended = () => {
            const currentIndex = currentFilteredSongs.findIndex(s => s.id === currentPlayingSongId);
            if (currentIndex !== -1 && currentIndex < currentFilteredSongs.length - 1) {
                playTrack(currentFilteredSongs[currentIndex + 1]);
            }
        };
    </script>
</body>
</html>
