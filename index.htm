<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotik — Твой музыкальный мир</title>
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 90px; /* Отступ снизу для плеера */
        }
        header {
            padding: 16px;
            background: #121212;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1db954;
        }
        /* Стили поисковой строки */
        .search-container {
            margin-bottom: 8px;
        }
        #searchInput {
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            border: none;
            background: #282828;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #searchInput::placeholder {
            color: #b3b3b3;
        }
        /* Список треков */
        .playlist {
            padding: 0 16px;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #282828;
            cursor: pointer;
            transition: background 0.2s;
        }
        .track-item:active {
            background: #1e1e1e;
        }
        .track-cover {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            margin-right: 12px;
            background: #282828;
        }
        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }
        .track-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .track-artist {
            font-size: 13px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Нижний плеер */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }
        .player-cover {
            width: 44px;
            height: 44px;
            border-radius: 4px;
            object-fit: cover;
            background: #282828;
        }
        .player-info {
            flex-grow: 1;
            overflow: hidden;
        }
        .player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-artist {
            font-size: 12px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .play-btn {
            background: #1db954;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-message {
            text-align: center;
            color: #b3b3b3;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spotik</h1>
        <div class="search-container">
            <!-- Поисковая строка -->
            <input type="text" id="searchInput" placeholder="Что хочешь послушать? (Трек или автор)..." oninput="filterSongs()">
        </div>
    </header>

    <div class="playlist" id="playlistContainer">
        <div class="empty-message">Загрузка музыки...</div>
    </div>

    <!-- Фиксированный музыкальный плеер снизу -->
    <div class="player-bar" id="playerBar" style="display: none;">
        <img src="" alt="" class="player-cover" id="playerCover">
        <div class="player-info">
            <div class="player-title" id="playerTitle">Выберите трек</div>
            <div class="player-artist" id="playerArtist">-</div>
        </div>
        <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
    </div>

    <audio id="audioPlayer" onended="onTrackEnded()"></audio>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        let allSongs = [];     // Полная база треков, загруженная из songs.json
        let currentTrackIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playerBar = document.getElementById('playerBar');
        const playerCover = document.getElementById('playerCover');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playlistContainer = document.getElementById('playlistContainer');

        // Загружаем songs.json с репозитория GitHub Pages
        fetch('songs.json')
            .then(response => response.json())
            .then(data => {
                allSongs = data;
                displaySongs(allSongs);
            })
            .catch(error => {
                console.error('Ошибка загрузки songs.json:', error);
                playlistContainer.innerHTML = '<div class="empty-message">Не удалось загрузить треки. Запусти updater.py!</div>';
            });

        // Функция отрисовки списка песен на экране
        function displaySongs(songsArray) {
            if (songsArray.length === 0) {
                playlistContainer.innerHTML = '<div class="empty-message">Ничего не найдено 😔</div>';
                return;
            }

            let html = '';
            songsArray.forEach((song, index) => {
                // Ищем реальный индекс трека в общем массиве allSongs для корректного воспроизведения
                let originalIndex = allSongs.findIndex(s => s.id === song.id);
                if (originalIndex === -1) originalIndex = index;

                html += `
                    <div class="track-item" onclick="playTrack(${originalIndex})">
                        <img src="${song.cover || 'https://via.placeholder.com/50'}" alt="" class="track-cover">
                        <div class="track-info">
                            <div class="track-title">${escapeHtml(song.title)}</div>
                            <div class="track-artist">${escapeHtml(song.artist)}</div>
                        </div>
                    </div>
                `;
            });
            playlistContainer.innerHTML = html;
        }

        // Функция поиска по названию трека или имени автора
        function filterSongs() {
            let query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = allSongs.filter(song => 
                song.title.toLowerCase().includes(query) || 
                song.artist.toLowerCase().includes(query)
            );
            
            displaySongs(filtered);
        }

        // Запуск воспроизведения трека по клику
        function playTrack(index) {
            currentTrackIndex = index;
            let song = allSongs[currentTrackIndex];

            audioPlayer.src = song.url;
            audioPlayer.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                playerBar.style.display = 'flex';
                playerCover.src = song.cover || '';
                playerTitle.textContent = song.title;
                playerArtist.textContent = song.artist;
            }).catch(e => {
                console.error("Ошибка воспроизведения аудио:", e);
            });
        }

        // Кнопка Пауза / Воспроизведение в плеере
        function togglePlay() {
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            } else {
                audioPlayer.play();
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            }
        }

        // Автоматический переход к следующему треку по окончании
        function onTrackEnded() {
            if (currentTrackIndex < allSongs.length - 1) {
                playTrack(currentTrackIndex + 1);
            } else {
                playTrack(0); // Зацикливание на первый трек
            }
        }

        // Защита от поломки верстки спецсимволами
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">").replace(/"/g, """).replace(/'/g, "'");
        }
    </script>
</body>
</html>
