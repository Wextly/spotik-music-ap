<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Mini App</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS для быстрого и красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f0c1b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Кастомный фиолетовый скроллбар */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #7b2cbf;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">

    <!-- Верхняя шапка -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#130f23] border-b border-[#241a42]">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#7b2cbf] to-[#c77dff] flex items-center justify-center font-bold text-lg shadow-lg shadow-purple-900/50" id="user-avatar">
                🎵
            </div>
            <div>
                <h1 class="text-sm font-bold text-purple-200" id="user-name">Медиатека</h1>
                <p class="text-xs text-purple-400">Бесплатный Spotify</p>
            </div>
        </div>
        <button onclick="alert('Все треки бесплатны и доступны без подписки!')" class="text-purple-400 hover:text-purple-200 text-xs bg-[#241a42] px-3 py-1.5 rounded-full border border-[#7b2cbf]/40">
            ✨ Premium Free
        </button>
    </header>

    <!-- Основной контент (Вкладки) -->
    <main class="flex-1 overflow-y-auto pb-32">
        <!-- Вкладка: Главная -->
        <div id="tab-home" class="p-4 space-y-6">
            <!-- Приветствие -->
            <div>
                <h2 class="text-xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-[#c77dff]">
                    Добрый вечер, меломан
                </h2>
                <p class="text-xs text-purple-400 mt-1">Твоя подборка на сегодня</p>
            </div>

            <!-- Главный баннер-плейлист -->
            <div onclick="playTrack(0)" class="relative rounded-2xl overflow-hidden bg-gradient-to-r from-[#3c096c] to-[#5a189a] p-4 shadow-xl shadow-purple-950/40 cursor-pointer border border-[#c77dff]/20">
                <div class="absolute -right-4 -bottom-4 text-7xl opacity-20">🎧</div>
                <span class="text-[10px] uppercase tracking-wider bg-black/30 px-2 py-0.5 rounded text-purple-300 font-semibold">Плейлист дня</span>
                <h3 class="text-lg font-bold mt-2 text-white">Фиолетовый Неон</h3>
                <p class="text-xs text-purple-200 mt-0.5">Synthwave, Lofi & Indie Hits</p>
            </div>

            <!-- Список треков (Быстрый доступ) -->
            <div>
                <h3 class="text-sm font-bold text-purple-300 mb-3">Популярные треки</h3>
                <div class="space-y-2" id="tracks-list">
                    <!-- Заполняется через JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Плеер внизу (Mini Player) -->
    <div id="mini-player" class="absolute bottom-16 left-2 right-2 bg-[#1b1335] border border-[#7b2cbf]/40 rounded-2xl p-3 flex items-center justify-between shadow-2xl backdrop-blur-md">
        <div class="flex items-center space-x-3 overflow-hidden cursor-pointer" onclick="openFullPlayer()">
            <div class="w-12 h-12 rounded-xl bg-purple-900 flex-shrink-0 flex items-center justify-center text-xl shadow-inner shadow-black" id="current-cover">
                🎵
            </div>
            <div class="truncate">
                <h4 class="text-xs font-bold text-white truncate" id="current-title">Выберите трек</h4>
                <p class="text-[10px] text-purple-300 truncate" id="current-artist">Исполнитель</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="togglePlay()" id="play-btn" class="w-10 h-10 rounded-full bg-[#9d4edd] text-white flex items-center justify-center shadow-md shadow-purple-900/50 hover:bg-[#c77dff] transition">
                ▶
            </button>
        </div>
    </div>

    <!-- Нижняя навигация (Меню) -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-[#100c1e] border-t border-[#241a42] flex items-center justify-around px-6 text-xs text-purple-400">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-[#c77dff]">
            <span class="text-lg">🏠</span>
            <span class="mt-0.5 font-medium">Главная</span>
        </button>
        <button onclick="alert('Поиск треков и жанров')" class="flex flex-col items-center hover:text-purple-200">
            <span class="text-lg">🔍</span>
            <span class="mt-0.5 font-medium">Поиск</span>
        </button>
        <button onclick="alert('Ваша медиатека пуста')" class="flex flex-col items-center hover:text-purple-200">
            <span class="text-lg">📚</span>
            <span class="mt-0.5 font-medium">Моя музыка</span>
        </button>
    </nav>

    <!-- Скрытый HTML5 аудио элемент -->
    <audio id="audio-element" preload="auto"></audio>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Подставляем имя из телеграма, если доступно
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name;
            if (user.first_name) {
                document.getElementById('user-avatar').innerText = user.first_name[0].toUpperCase();
            }
        }

        // Список треков (бесплатная музыка из открытых источников)
        const playlist = [
            {
                title: "Midnight Cyberpunk",
                artist: "Neon Dreams",
                cover: "🌆",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                title: "Purple Sunset",
                artist: "Synth Rider",
                cover: "💜",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                title: "Digital Rain",
                artist: "Lofi hacker",
                cover: "🌧️",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        const audioElement = document.getElementById('audio-element');

        // Рендер треков в списке
        function renderTracks() {
            const container = document.getElementById('tracks-list');
            container.innerHTML = '';
            playlist.forEach((track, index) => {
                container.innerHTML += `
                    <div onclick="playTrack(${index})" class="flex items-center justify-between p-2.5 rounded-xl bg-[#161029] hover:bg-[#20173d] transition cursor-pointer border border-[#7b2cbf]/10">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-lg bg-purple-950 flex items-center justify-center text-lg">${track.cover}</div>
                            <div>
                                <h4 class="text-xs font-bold text-white">${track.title}</h4>
                                <p class="text-[10px] text-purple-400">${track.artist}</p>
                            </div>
                        </div>
                        <span class="text-purple-400 text-xs">▶</span>
                    </div>
                `;
            });
        }

        function playTrack(index) {
            currentIndex = index;
            const track = playlist[index];
            
            document.getElementById('current-title').innerText = track.title;
            document.getElementById('current-artist').innerText = track.artist;
            document.getElementById('current-cover').innerText = track.cover;

            audioElement.src = track.url;
            audioElement.play();
            isPlaying = true;
            document.getElementById('play-btn').innerText = "⏸";
        }

        function togglePlay() {
            if (!audioElement.src) {
                playTrack(0);
                return;
            }
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
                document.getElementById('play-btn').innerText = "▶";
            } else {
                audioElement.play();
                isPlaying = true;
                document.getElementById('play-btn').innerText = "⏸";
            }
        }

        renderTracks();
    </script>
</body>
</html>
